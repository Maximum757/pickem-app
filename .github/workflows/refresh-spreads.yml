name: Daily spread refresh

on:
  schedule:
    # 10:00 UTC daily = 6:00 AM ET (5:00 AM during EST) — early enough that
    # any bad run is caught well before people are checking picks.
    - cron: "0 10 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab too

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Write service account key from secret
        run: echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > serviceAccountKey.json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Write .env.local
        run: |
          echo "FIREBASE_SERVICE_ACCOUNT_PATH=./serviceAccountKey.json" >> .env.local
          echo "REACT_APP_LEAGUE_ID=${{ vars.REACT_APP_LEAGUE_ID || 'week0-test-league' }}" >> .env.local

      - name: Refresh spreads
        run: npm run refresh:spreads

      - name: Clean up credentials
        if: always()
        run: rm -f serviceAccountKey.json .env.local
